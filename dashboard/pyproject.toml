# Python dependencies of the Vercel Function in api/worker.py.
# The worker package lives next door in ../worker and is pure Python. The "llm" extra adds the Anthropic
# SDK for the optional rebalance reviewer; it stays unused unless TB_LLM_ENABLED=true and a key are set.
# The "ai" extra adds numpy, which only the AI desk's training job imports.
[project]
name = "thunderbot-functions"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["thunderbot[llm,ai]"]

[tool.uv.sources]
thunderbot = { path = "../worker" }
