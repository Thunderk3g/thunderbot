[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thunderbot"
version = "0.1.0"
description = "Deterministic intraday/delivery trading engine for Groww with an LLM signal filter that cannot override hard risk limits."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
groww = ["growwapi>=1.5.0", "pyotp>=2.9"]
yahoo = ["yfinance>=0.2.54"]
llm = ["anthropic>=1.15.0", "pydantic>=2.6"]
ai = ["numpy>=1.26"]  # training the AI desk's model; prediction needs nothing
secrets = ["cryptography>=42"]  # reading keys saved from the dashboard's setup screen; environment keys need nothing
all = ["growwapi>=1.5.0", "pyotp>=2.9", "yfinance>=0.2.54", "anthropic>=1.15.0", "pydantic>=2.6", "numpy>=1.26",
       "cryptography>=42"]
dev = ["pytest>=8", "pydantic>=2.6", "numpy>=1.26", "cryptography>=42"]

[project.scripts]
thunderbot = "thunderbot.cli:main"

[tool.setuptools.packages.find]
include = ["thunderbot*"]

[tool.setuptools.package-data]
thunderbot = ["universes/*.txt", "harness/default/*.toml", "harness/default/*/*.toml", "harness/default/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
